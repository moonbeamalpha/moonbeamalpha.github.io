<!doctype html>
<!-- Social artwork source. Render at 1200 × 630; exported as /images/ask-aura-og.jpg. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex, nofollow">
  <title>Ask Aura social artwork — Azure Mastery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;650;700&amp;family=DM+Sans:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; background: #f7faff; color: #112440; font-family: 'DM Sans', sans-serif; }
    .brand { position: absolute; top: 52px; left: 64px; display: flex; align-items: center; gap: 16px; font: 650 32px/1.2 Outfit, sans-serif; letter-spacing: -.025em; }
    .brand img { width: 50px; height: 50px; border-radius: 12px; }
    .copy { position: absolute; top: 173px; left: 64px; width: 620px; }
    .badge { display: inline-flex; padding: 9px 15px; border-radius: 999px; background: #0964c4; color: #fff; font: 600 17px/1.2 Outfit, sans-serif; letter-spacing: .035em; }
    h1 { margin: 21px 0 10px; font: 700 82px/1.05 Outfit, sans-serif; letter-spacing: -.045em; }
    .tagline { margin: 0; max-width: 600px; font: 500 37px/1.22 Outfit, sans-serif; letter-spacing: -.025em; }
    .detail { margin: 25px 0 0; max-width: 560px; color: #47627e; font-size: 21px; line-height: 1.55; }
    .orbit { position: absolute; top: 107px; right: 58px; width: 415px; height: 415px; border: 1px solid #b0d8ed; border-radius: 50%; background: #eaf4ff; }
    .aura { position: absolute; width: 380px; height: auto; right: 76px; top: 15px; }
    .footer { position: absolute; bottom: 42px; left: 64px; display: flex; gap: 22px; align-items: center; font: 500 20px/1.3 Outfit, sans-serif; }
    .footer span:first-child { color: #007f9f; }
    .footer span:last-child { padding-left: 22px; border-left: 1px solid #c8d7e6; color: #47627e; font-size: 17px; }
  </style>
</head>
<body>
  <div class="brand"><img src="/images/azure-mastery-icon.webp" alt="" width="50" height="50">Azure Mastery</div>
  <div class="copy"><span class="badge">NEW IN 2.0 · PREVIEW FOR PRO MEMBERS</span><h1>Ask Aura.</h1><p class="tagline">Your private<br>study companion.</p><p class="detail">Reviewed exam material.<br>A focused next step, together.</p></div>
  <div class="orbit" aria-hidden="true"></div>
  <img class="aura" src="/images/aura-meet.webp" alt="Aura waving hello" width="640" height="960">
  <div class="footer"><span>azuremastery.app/ask-aura</span><span>For iPhone &amp; iPad</span></div>
</body>
</html>
