name: Marketing counts

# The advertised exam and question totals count only exams a candidate can still
# book, and retirement is evaluated against the current date. That means these
# numbers can go stale on a calendar date with no commit behind it — AZ-500
# retires 31 August 2026 — so the nightly run is the point of this workflow.
# push/pull_request only stop a hand-edit from reintroducing drift.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  counts:
    name: Counts match the sit-able catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --check reads the committed data/exam-counts.json rather than the app
      # repo, and --no-render skips the headless-Chrome social render, so this
      # needs nothing but Python. It also reports retired exams whose markup was
      # never moved into the retired groups.
      - name: Exam and question counts
        run: python3 Tools/sync-marketing-counts.py --check --no-render

      - name: SEO contract
        run: python3 Tools/validate-marketing-seo.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Homepage CSS bundle is current
        run: bash Tools/build-home-css.sh --check

      - name: Performance contracts
        run: node Tools/check-marketing-performance.mjs
