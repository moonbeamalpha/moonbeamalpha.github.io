name: Marketing counts

# The advertised exam and question totals count only exams a candidate can still
# book, and retirement is evaluated against the current date. That means these
# numbers can go stale on a calendar date with no commit behind it — AZ-500
# retires 31 August 2026 — so the nightly run is the point of this workflow.
# push/pull_request only stop a hand-edit from reintroducing drift.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  counts:
    name: Counts match the sit-able catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --check reads the committed data/exam-counts.json rather than the app
      # repo, and --no-render skips the headless-Chrome social render, so this
      # needs nothing but Python. It also reports retired exams whose markup was
      # never moved into the retired groups.
      - name: Exam and question counts
        run: python3 Tools/sync-marketing-counts.py --check --no-render

      # Self-test for sync-marketing-counts.py's per-domain count patching
      # (patch_domain_counts/check_domain_mismatches) against in-memory HTML
      # fixtures -- stdlib only, no app-repo checkout needed, so it runs from
      # this committed tree alone.
      - name: Domain-count patcher self-test
        run: python3 Tools/test-domain-counts.py

      # Ratchets the current exam pages against reading as one templated skeleton
      # (see Tools/check-page-similarity.py's docstring and the task-B3 brief) --
      # fails if any shared pair, the highest-similarity pair, or the corpus
      # mean grows more than 0.005 over the committed
      # Tools/page-similarity-baseline.json. The
      # baseline only tightens, via --update-baseline after a page is rewritten.
      - name: Exam page similarity ratchet
        run: python3 Tools/check-page-similarity.py --check

      # Sitemap <lastmod> is derived from git history, so this needs full
      # history -- hence fetch-depth: 0 above (actions/checkout defaults to a
      # shallow, 1-commit clone with no dates to read).
      - name: Sitemap lastmod values are current
        run: python3 Tools/update-sitemap-lastmod.py --check

      # Both patchers are idempotent, dependency-free batch rewrites (sticky
      # bar/mid-page CTAs/nav badge; the GA4 internal-traffic flag) -- --check
      # catches a page added or hand-edited without re-running them.
      - name: Exam page CTA surfaces are current
        run: python3 Tools/add-exam-page-cta.py --check

      - name: Marketing UI contracts are current
        run: python3 Tools/check-marketing-ui.py

      - name: Static asset versions are current
        run: python3 Tools/version-static-assets.py --check

      # Every exam page's FAQPage JSON-LD must byte-match its visible
      # <details class="faq"> text -- Google requires FAQ structured data to
      # match the visible page content. --check reports which pages/questions
      # have drifted and exits non-zero; re-run after editing any exam-page FAQ.
      - name: Exam FAQ schema matches visible text
        run: python3 Tools/sync-exam-faq-schema.py --check

      - name: GA4 internal-traffic flag is current
        run: python3 Tools/add-ga-internal-flag.py --check

      # Footer self-links (About, How we write questions) on every page --
      # --check catches a page added or hand-edited without re-running it.
      - name: Footer links are current
        run: python3 Tools/add-footer-links.py --check

      - name: SEO contract
        run: python3 Tools/validate-marketing-seo.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Homepage CSS bundle is current
        run: bash Tools/build-home-css.sh --check

      - name: Performance contracts
        run: node Tools/check-marketing-performance.mjs
